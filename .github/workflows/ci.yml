name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Debug build
        run: swift build

      - name: Release build
        run: swift build -c release

      - name: Test
        run: swift test
        continue-on-error: true # no test target yet — flip this once one exists
